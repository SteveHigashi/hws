version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-higashi}
      POSTGRES_USER: ${DB_USER:-higashi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-higashi}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-higashi}
      SECRET_KEY: ${SECRET_KEY:-changeme_generate_a_real_key}
      FIRST_RUN: ${FIRST_RUN:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
